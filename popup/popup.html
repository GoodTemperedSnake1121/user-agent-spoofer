<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User-Agent Spoofer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            width: 420px;
            min-height: 560px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: #202124;
            color: #f1f3f4;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 21px;
            font-weight: 600;
        }

        .section {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #cfd2d6;
        }

        input,
        select,
        textarea,
        button {
            font: inherit;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #5f6368;
            border-radius: 6px;
            background: #303134;
            color: #f1f3f4;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #8ab4f8;
        }

        #profile {
            width: 100%;
            padding: 4px;
            border: 1px solid #5f6368;
            border-radius: 6px;
            background: #303134;
            color: #f1f3f4;
        }

        #profile option,
        #profile optgroup {
            background: #303134;
            color: #f1f3f4;
        }

        #profile optgroup {
            font-weight: 600;
        }

        #profile option {
            padding: 5px;
        }

        .info {
            padding: 10px;
            border-radius: 6px;
            background: #292a2d;
            border: 1px solid #3c4043;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 4px 0;
            font-size: 12px;
        }

        .info-label {
            color: #9aa0a6;
        }

        .info-value {
            text-align: right;
            overflow-wrap: anywhere;
        }

        #userAgent {
            min-height: 80px;
            resize: vertical;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            flex: 1;
            padding: 9px 12px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            background: #8ab4f8;
            color: #202124;
            font-weight: 600;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:active {
            filter: brightness(0.95);
        }

        #saveCustom {
            background: #3c4043;
            color: #f1f3f4;
        }

        #statusText {
            min-height: 18px;
            margin-top: 8px;
            font-size: 12px;
            color: #9aa0a6;
        }
    </style>
</head>

<body>

    <h1>🕵️ User-Agent Spoofer</h1>

    <div class="section">
        <label for="search">Search profiles</label>

        <input
            type="text"
            id="search"
            placeholder="Search browser, OS, bot..."
            autocomplete="off"
        >
    </div>

    <div class="section">
        <label for="profile">User-Agent profile</label>

        <select id="profile" size="9">
            <option>Loading profiles...</option>
        </select>
    </div>

    <div class="section info">

        <div class="info-row">
            <span class="info-label">Browser</span>
            <span class="info-value" id="browserInfo">—</span>
        </div>

        <div class="info-row">
            <span class="info-label">OS</span>
            <span class="info-value" id="osInfo">—</span>
        </div>

        <div class="info-row">
            <span class="info-label">Device</span>
            <span class="info-value" id="deviceInfo">—</span>
        </div>

        <div class="info-row">
            <span class="info-label">Version</span>
            <span class="info-value" id="versionInfo">—</span>
        </div>

    </div>

    <div class="section">

        <label for="userAgent">User-Agent</label>

        <textarea
            id="userAgent"
            spellcheck="false"
            placeholder="Select a profile..."
        ></textarea>

    </div>

    <div class="section">

        <label for="customUserAgent">Custom User-Agent</label>

        <input
            type="text"
            id="customUserAgent"
            placeholder="Enter a custom User-Agent..."
            autocomplete="off"
        >

        <div class="button-row">

            <button id="saveCustom" type="button">
                Save Custom
            </button>

            <button id="apply" type="button">
                Apply
            </button>

        </div>

        <div id="statusText"></div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
