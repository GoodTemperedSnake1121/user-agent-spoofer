name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in Firespoof.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## Found a bug in Firespoof? 🐛

        Thanks for helping improve Firespoof!
        Please provide enough information to reproduce the problem.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug you encountered.
      placeholder: "When I select a user-agent profile..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce the problem.
      placeholder: |
        1. Open Firespoof.
        2. Select a profile.
        3. Visit a website.
        4. Observe the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
      placeholder: "I expected..."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Firespoof version
      description: Which version are you using?
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox Desktop
        - Firefox for Android
        - Chromium-based browser
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages or additional information
      description: Include relevant errors, but remove passwords, tokens, and other private information.
      placeholder: "Paste relevant error messages here."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues for similar reports.
          required: true
